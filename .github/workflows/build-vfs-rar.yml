name: Build vfs.rar (Windows)

on:
  workflow_dispatch:
  push:
    branches: [ stored-fix ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout xbmc (Omega branch, for cmake addon-helper scripts + dev-kit headers)
        uses: actions/checkout@v4
        with:
          repository: xbmc/xbmc
          ref: Omega
          path: xbmc
          fetch-depth: 1

      # Must land in a folder literally named "vfs.rar" inside an "addons-src"
      # parent, because Kodi's build_addon macro looks for
      # <ADDON_SRC_PREFIX>/<addon-id>/CMakeLists.txt
      - name: Checkout this vfs.rar fork (with the fix applied)
        uses: actions/checkout@v4
        with:
          path: addons-src/vfs.rar
          fetch-depth: 1

      # windows-latest ships CMake 4.x, which refuses to configure very old
      # projects (like the tinyxml dependency Kodi's build pulls in) that
      # declare cmake_minimum_required below 3.5. Pin the last 3.x release,
      # which still supports them, ahead of the pre-installed one on PATH.
      - name: Pin CMake 3.31.x (for legacy dependency compatibility)
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.31.6'

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        shell: cmd
        run: |
          mkdir build
          cd build
          cmake -G "NMake Makefiles" ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DADDONS_TO_BUILD=vfs.rar ^
            -DADDON_SRC_PREFIX=../addons-src ^
            -DCMAKE_INSTALL_PREFIX=../xbmc/kodi-build/addons ^
            -DPACKAGE_ZIP=1 ^
            ../xbmc/cmake/addons

      - name: Build
        shell: cmd
        run: |
          cd build
          cmake --build .

      - name: Locate build output (debug helper — lists what actually got produced)
        shell: cmd
        run: |
          dir /s /b xbmc\kodi-build\addons\*.dll
          dir /s /b build\*.dll

      - name: Upload built DLL and any packaged zip
        uses: actions/upload-artifact@v4
        with:
          name: vfs.rar-windows-build
          path: |
            xbmc/kodi-build/addons/**/*.dll
            build/**/*.dll
            build/**/*.zip
          if-no-files-found: warn
