name: Build vfs.rar (Windows)

on:
  workflow_dispatch:   # lets you trigger it manually from the Actions tab
  push:
    branches: [ stored-fix ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout xbmc (Omega branch, for cmake addon-helper scripts + dev-kit headers)
        uses: actions/checkout@v4
        with:
          repository: xbmc/xbmc
          ref: Omega
          path: xbmc
          fetch-depth: 1

      - name: Checkout this vfs.rar fork (with the fix applied)
        uses: actions/checkout@v4
        with:
          path: vfs.rar
          fetch-depth: 1

      - name: Configure
        shell: cmd
        run: |
          mkdir vfs.rar\build
          cd vfs.rar\build
          cmake -G "Visual Studio 17 2022" -A x64 ^
            -DADDONS_TO_BUILD=vfs.rar ^
            -DADDON_SRC_PREFIX=.. ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_INSTALL_PREFIX=..\..\xbmc\kodi-build\addons ^
            -DPACKAGE_ZIP=1 ^
            ..\..\xbmc\cmake\addons

      - name: Build
        shell: cmd
        run: |
          cd vfs.rar\build
          cmake --build . --config Release

      - name: Locate build output (debug helper — lists what actually got produced)
        shell: cmd
        run: |
          dir /s /b xbmc\kodi-build\addons\*.dll
          dir /s /b vfs.rar\build\*.dll

      - name: Upload built DLL and any packaged zip
        uses: actions/upload-artifact@v4
        with:
          name: vfs.rar-windows-build
          path: |
            xbmc/kodi-build/addons/**/*.dll
            vfs.rar/build/**/*.zip
          if-no-files-found: warn
